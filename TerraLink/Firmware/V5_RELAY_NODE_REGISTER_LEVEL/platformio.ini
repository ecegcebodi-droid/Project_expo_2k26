[platformio]
default_envs = relay1


; ================================================================
; TERRALINK ROUTED RELAY NODE
; Arduino UNO + AI-Thinker RA-02 / SX1278
; ================================================================


[env:relay1]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 9600
upload_speed = 115200

build_type = release

build_unflags =
    -Wunused-parameter

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter


[env:relay2]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 9600
upload_speed = 115200

build_type = release

build_unflags =
    -Wunused-parameter

build_flags =
    -DTL_RELAY_NODE_ID=3
    -Wall
    -Wextra
    -Wno-unused-parameter